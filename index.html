<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sport</title>

    <!-- links -->
        <link rel="stylesheet" href="src/styles/home.css">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <!-- Fim Google Fonts -->

        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
        
        <!--BOOTSTRAP ICONS-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!--FIM BOOTSTRAP ICONS-->

</head>
<body>

    <header id="header" class="header">
        <div class="interface">
            <div class="logo">
                <a href="#">
                    <img src="src/assets/Logo.png" alt="Logo">
                </a>
            </div><!--Logo-->

        
        <nav class="menu-desktop">
            <ul>
                <li><a href="#">Lançamentos</a></li>
                <li><a href="#">Mais vendidas</a></li>
                <li><a href="#">Esportes</a></li>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                
            </ul>
        </nav>

        <div class="btn-carrinho">
            <a href="">
                <button><i class="bi bi-bag"></i></button>
            </a>
        </div>
    </div><!--interface-->

    </header>

    <main>
        <section class="topo-site">
                    
                    <div class="carrossel-topo-site">

                        <div class="card-carrossel">
                            <img src="src/assets/futebol.png" alt="">
                        </div> <!--slide 1-->
                        <div class="card-carrossel">
                            <img src="src/assets/basquete.png" alt="">
                        </div> <!--slide 2-->
                        <div class="card-carrossel">
                            <img src="src/assets/formula1.png" alt="">
                        </div> <!--slide 3-->
                        <div class="card-carrossel">
                            <img src="src/assets/baseball.png" alt="">
                        </div> <!--slide 4-->
                        <div class="card-carrossel">
                            <img src="src/assets/futebol-americano.png" alt="">
                        </div> <!--slide 5-->

                    </div><!--container-carrossel-topo-site-->

        </section><!--topo-site-->

        <section class="lancamentos" id="lancamentos">
            <div class="interface">
                <h2 class="titulo">LANÇAMENTOS</h2>
                <div class="flex">

                    <div class="lancamentos-box" style="background-image:url(src/assets/fut\ card.png) ;">
                        <div class="overlay">Camiseta Brasil</div>
                    </div>
                    <div class="lancamentos-box" style="background-image:url(src/assets/bsqt\ card.png) ;">
                        <div class="overlay">Regata Basquete</div>
                    </div>
                    <div class="lancamentos-box" style="background-image:url(src/assets/f1\ card.png) ;">
                        <div class="overlay">Camisa Formula 1</div>
                    </div>
                    <div class="lancamentos-box" style="background-image:url(src/assets/ftba\ card.png) ;">
                        <div class="overlay">Camiseta Futebol Americano</div>
                    </div>
                    <div class="lancamentos-box" style="background-image:url(src/assets/base\ card.png) ;">
                        <div class="overlay">Camiseta Basebol</div>
                    </div>
                    
                   

                </div>
            </div>
        </section>

        <section class="maisVendidas">
            
                <h2 class="titulo">MAIS VENDIDAS</h2>
                
                <div class="swiper-container">
                    <div class="swiper">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide">
                                <div class="slide-content">
                                    <img src="src/assets/fut card.png" alt="">
                                </div>
                            </div>
                        
                            <div class="swiper-slide">
                                <div class="slide-content">
                                    <img src="src/assets/bsqt card.png" alt="">
                                </div>
                            </div>

                            <div class="swiper-slide">
                                <div class="slide-content">
                                    <img src="src/assets/f1 card.png" alt="">
                                </div>
                            </div>
                            <div class="swiper-slide">
                                <div class="slide-content">
                                    <img src="src/assets/ftba card.png" alt="">
                                </div>
                            </div>
                            <div class="swiper-slide">
                                <div class="slide-content">
                                    <img src="src/assets/base card.png" alt="">
                                </div>
                            </div>
                    </div>
                    <div class="swiper-button-prev">
                    </div>
                    <div class="swiper-button-next">
                    </div>
                </div>

                    </div>
        </section>

    </main>

    <!--JS header-->
    <script src="src/js/header.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <!--JS carrossel-->
    <script src="src/js/carrossel.js"></script>


</body>
</html>
